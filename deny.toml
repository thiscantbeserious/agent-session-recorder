# Supply-chain checks for agr, run by the `Dependency audit` CI job (cargo deny check).
# Tracking issue for the audit: #183.

[graph]
all-features = true

[advisories]
# A new advisory fails CI. Every ignore names the issue that removes it, delete the
# line together with the fix. cargo audit (.cargo/audit.toml) runs as well, its
# advisory snapshot also flags lru (RUSTSEC-2026-0002, -0253) which this one does not.
ignore = [
    { id = "RUSTSEC-2026-0204", reason = "crossbeam-epoch via rayon, #175" },
    { id = "RUSTSEC-2026-0009", reason = "time via vergen-gitcl, build only, #169" },
    { id = "RUSTSEC-2026-0190", reason = "anyhow downcast_mut, #181" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained via ratatui 0.29, #173" },
]

[licenses]
# Permissive licenses only. agr is MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    # File-level copyleft, fine to link into an MIT binary. Goes away with #177.
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
# Duplicate versions are expected (sha2 and the RustCrypto 0.11 stack), report only.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only, no git or other registries.
unknown-registry = "deny"
unknown-git = "deny"
